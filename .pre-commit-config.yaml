repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        exclude: ^migrations/
        args: [--disallow-untyped-defs, --disallow-incomplete-defs, --explicit-package-bases, --ignore-missing-imports, --install-types, --non-interactive]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        exclude: ^migrations/
        args: ["--ignore=E501,W503"] # ignore max line length
