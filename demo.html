<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSP Ad Integration Demo</title>
    <style>
        .ad-container {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px;
            border-radius: 4px;
            max-width: 600px;
        }
        .chat-container {
            margin: 20px;
            max-width: 600px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .user-message {
            background-color: #e3f2fd;
        }
        .assistant-message {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Chat Demo</h2>
        <div id="chat-messages"></div>
        <div style="margin-top: 20px;">
            <input type="text" id="user-input" style="width: 80%;" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="ad-container">
        <h3>Sponsored Content</h3>
        <div id="ad-content"></div>
    </div>

    <script>
        const SSP_URL = 'http://localhost:8001';

        async function requestAd(query, output) {

            const user_info = {
                name: "John Doe",
                age: 25,
                gender: "male",
                country: "US",
                interests: ["sports", "music", "travel"]
            };

            const publisherInfo = {
                name: "Demo Website",
                user_info: user_info,
            };

            try {
                const response = await fetch(`${SSP_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query,
                        output,
                        publisher_info: publisherInfo,
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch ad');
                }

                const ad = await response.json();
                displayAd(ad);

                // Track impression
                await fetch(`${SSP_URL}/ad/track-impression?id=${ad.id}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
            } catch (error) {
                console.error('Error fetching ad:', error);
            }
        }

        function displayAd(ad) {
            const adContainer = document.getElementById('ad-content');
            adContainer.innerHTML = `
                <p>${ad.content}</p>
                <small>Ad ID: ${ad.id}</small>
            `;
        }

        function displayMessage(message, isUser) {
            const messagesContainer = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
            messageDiv.textContent = message;
            messagesContainer.appendChild(messageDiv);
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            
            if (!query) return;

            // Display user message
            displayMessage(query, true);
            
            // Simulate assistant response (in a real scenario, this would come from your AI service)
            const assistantResponse = "This is a simulated assistant response.";
            displayMessage(assistantResponse, false);
            
            // Request an ad based on the conversation
            await requestAd(query, assistantResponse);
            
            // Clear input
            input.value = '';
        }
    </script>
</body>
</html>
