services:

  demo-publisher:
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_DEMO_INFERENCE_WEBSOCKET_URL=${REACT_APP_DEMO_INFERENCE_WEBSOCKET_URL}
    depends_on:
      - demo-chatbot

  demo-chatbot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
