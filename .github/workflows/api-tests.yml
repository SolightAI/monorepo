name: API Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'wapp/api/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'wapp/api/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wapp/api

    env:
      # Database config
      POSTGRES_DB: "test"
      POSTGRES_USER: "test"
      POSTGRES_PASSWORD: "test"
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: "localhost"
      # JWT Authentication
      JWT_SECRET_KEY: "test_secret_key_for_testing_only"
      # App config
      APP_URL: "http://localhost:3000"
      API_URL: "http://localhost:8000"
      DEBUG: "True"
      # Google OAuth
      GOOGLE_CLIENT_ID: "test_google_client_id"
      GOOGLE_CLIENT_SECRET: "test_google_client_secret"
      GOOGLE_REDIRECT_URI: "http://localhost:8000/auth/google/callback"
      # Azure OAuth
      AZURE_CLIENT_ID: "test_azure_client_id"
      AZURE_CLIENT_SECRET: "test_azure_client_secret"
      AZURE_TENANT_ID: "test_azure_tenant_id"
      AZURE_REDIRECT_URI: "http://localhost:8000/auth/azure/callback"
      SECRET_ENCRYPTION_KEY: "test_encryption_key_for_testing_only"
      TASK_MANAGER_URL: "http://localhost:8001"
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        pip install -e .[test]
      env:
        PYTHONPATH: ${{ github.workspace }}

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=src --cov-report=xml:coverage-unit.xml

    # - name: Run integration tests
    #   run: |
    #     pytest tests/integration -v --cov=src --cov-report=xml:coverage-integration.xml
    #   env:
    #     PYTHONPATH: ${{ github.workspace }}

    - name: Run functional tests
      run: |
        pytest tests/functional -v --cov=src --cov-report=xml:coverage-functional.xml
      env:
        PYTHONPATH: ${{ github.workspace }}
