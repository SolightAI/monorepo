name: Task Manager Playground Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'task-manager/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'task-manager/**'
  # Manual trigger
  workflow_dispatch:

jobs:

  auth-session-tests:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./task-manager

    env:
      # Azure OpenAI settings (required for the auth agent)
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      # Playground settings
      PLAYGROUND_URL: "https://playground.tm.laneo.io"
      PYTHONPATH: ${{ github.workspace }}/task-manager
      TEST_MODE: "true"
      FARMZZ_PASSWORD: ${{ secrets.FARMZZ_PASSWORD }}
      FARMZZ_USERNAME: ${{ secrets.FARMZZ_USERNAME }}
      TECLA_ACADEMY_PASSWORD: ${{ secrets.TECLA_ACADEMY_PASSWORD }}
      TECLA_ACADEMY_USERNAME: ${{ secrets.TECLA_ACADEMY_USERNAME }}


    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager
        file: ./task-manager/Dockerfile
        push: false
        load: true
        tags: task-manager:test

    - name: Run auth session tests
      # Use the built Docker image
      run: |
        docker run \
          --network host \
          -e AZURE_OPENAI_KEY \
          -e AZURE_OPENAI_ENDPOINT \
          -e PLAYGROUND_URL \
          -e TEST_MODE \
          -e FARMZZ_PASSWORD \
          -e FARMZZ_USERNAME \
          -e TECLA_ACADEMY_PASSWORD \
          -e TECLA_ACADEMY_USERNAME \
          -v ${{ github.workspace }}/task-manager:/app \
          -v /tmp/playwright-browsers:/root/.cache/ms-playwright \
          task-manager:test \
          bash -c "cd .. ; pytest -vvv"
