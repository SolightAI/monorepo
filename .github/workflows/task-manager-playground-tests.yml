name: Task Manager Playground Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'task-manager/**'
  pull_request:
    branches: [ main ]
    # paths:
    #   - 'task-manager/**'
  # Manual trigger
  workflow_dispatch:

jobs:

  auth-session-tests:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./task-manager

    env:
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      PLAYGROUND_URL: "http://playground:3000" # use container endpoint
      PYTHONPATH: ${{ github.workspace }}/task-manager
      TEST_MODE: "false"  # we want to upload the results to S3
      FARMZZ_PASSWORD: ${{ secrets.FARMZZ_PASSWORD }}
      FARMZZ_USERNAME: ${{ secrets.FARMZZ_USERNAME }}
      TECLA_ACADEMY_PASSWORD: ${{ secrets.TECLA_ACADEMY_PASSWORD }}
      TECLA_ACADEMY_USERNAME: ${{ secrets.TECLA_ACADEMY_USERNAME }}
      S3_BUCKET_NAME: task-manager-github-actions
      AWS_ENDPOINT_URL: https://minio-n0ooc44wsgk0kkkwoksw48ck.34.155.147.62.sslip.io
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TASK_MANAGER_IMAGE: task-manager:test
      PLAYGROUND_IMAGE: playground:test
      PLAYWRIGHT_IMAGE: task-manager:with-playwright

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build test Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager
        file: ./task-manager/Dockerfile
        push: false
        load: true
        tags: ${{ env.TASK_MANAGER_IMAGE }}
        build-args: |
          SKIP_PLAYWRIGHT_INSTALL=true

    - name: Build playground Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager/tests/playground
        file: ./task-manager/tests/playground/Dockerfile
        push: false
        load: true
        tags: ${{ env.PLAYGROUND_IMAGE }}

    - name: Setup Playwright if needed
      run: |
        # Define persistent volume for Playwright
        PLAYWRIGHT_VOLUME="/var/playwright-data"
        
        # Check if Playwright is already installed in the persistent volume
        if [ -d "$PLAYWRIGHT_VOLUME/ms-playwright" ] && [ "$(ls -A $PLAYWRIGHT_VOLUME/ms-playwright 2>/dev/null)" ]; then
          echo "Playwright is already installed in persistent volume"
          PLAYWRIGHT_INSTALLED=true
        else
          echo "Playwright not found in persistent volume, will install it"
          # Make sure volume directory exists
          sudo mkdir -p $PLAYWRIGHT_VOLUME
          sudo chmod 777 $PLAYWRIGHT_VOLUME
          PLAYWRIGHT_INSTALLED=false
        fi

        # Create a container to install Playwright if needed
        docker run --name playwright-setup \
          -v $PLAYWRIGHT_VOLUME:/root/.cache/ms-playwright \
          ${{ env.TASK_MANAGER_IMAGE }} \
          bash -c "cd /app && pip install playwright pytest-xdist && if [ ! $PLAYWRIGHT_INSTALLED ]; then playwright install --with-deps; fi"

        # Commit the container with installed Playwright to a new image
        docker commit playwright-setup ${{ env.PLAYWRIGHT_IMAGE }}

        # Remove the temporary container
        docker rm playwright-setup

    - name: Create Docker network
      run: docker network create test-network

    - name: Run playground container
      run: |
        docker run -d \
          --name playground \
          --network test-network \
          -p 3000:3000 \
          ${{ env.PLAYGROUND_IMAGE }}
          
    - name: Wait for playground to be ready
      run: |
        timeout=20
        counter=0
        until curl -s http://localhost:3000 > /dev/null; do
          echo "Waiting for playground to be ready... ($counter seconds elapsed)"
          sleep 2
          counter=$((counter + 2))
          if [ $counter -ge $timeout ]; then
            echo "Error: Playground failed to start within $timeout seconds"
            exit 1
          fi
        done
        echo "Playground is ready!"

    - name: Run auth session tests
      run: |
        docker run \
          --network test-network \
          -e AZURE_OPENAI_KEY \
          -e AZURE_OPENAI_ENDPOINT \
          -e PLAYGROUND_URL \
          -e TEST_MODE \
          -e FARMZZ_PASSWORD \
          -e FARMZZ_USERNAME \
          -e TECLA_ACADEMY_PASSWORD \
          -e TECLA_ACADEMY_USERNAME \
          -e S3_BUCKET_NAME \
          -e AWS_ENDPOINT_URL \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -v ${{ github.workspace }}/task-manager:/app \
          -v /var/playwright-data:/root/.cache/ms-playwright \
          ${{ env.PLAYWRIGHT_IMAGE }} \
          bash -c "cd /app && python -m pytest -vvs -n auto"

    - name: Cleanup
      if: always()
      run: |
        docker rm -f playground || true
        docker network rm test-network || true
