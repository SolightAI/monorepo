name: Task Manager Playground Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'task-manager/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-group: [1, 2, 3]  # Run tests in parallel
      fail-fast: false  # Don't stop other jobs if one fails

    defaults:
      run:
        working-directory: ./task-manager

    env:
      # Azure OpenAI settings
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      # Playground settings
      PLAYGROUND_URL: "http://localhost:3000"
      PYTHONPATH: ${{ github.workspace }}/task-manager
      TEST_MODE: "false"
      FARMZZ_PASSWORD: ${{ secrets.FARMZZ_PASSWORD }}
      FARMZZ_USERNAME: ${{ secrets.FARMZZ_USERNAME }}
      TECLA_ACADEMY_PASSWORD: ${{ secrets.TECLA_ACADEMY_PASSWORD }}
      TECLA_ACADEMY_USERNAME: ${{ secrets.TECLA_ACADEMY_USERNAME }}
      S3_BUCKET_NAME: task-manager-github-actions
      AWS_ENDPOINT_URL: https://minio-n0ooc44wsgk0kkkwoksw48ck.34.155.147.62.sslip.io
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DOCKER_REGISTRY: docker.io
      DOCKER_USERNAME_CI: ${{ secrets.DOCKER_USERNAME_CI }}
      DOCKER_PASSWORD_CI: ${{ secrets.DOCKER_PASSWORD_CI }}
      PLAYWRIGHT_IMAGE: laneoai/task-manager:with-playwright

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-flags: --debug

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME_CI }}
        password: ${{ secrets.DOCKER_PASSWORD_CI }}

    # Check if Playwright Docker image exists
    - name: Check if Playwright image exists
      id: check-image
      run: |
        if docker manifest inspect ${{ env.PLAYWRIGHT_IMAGE }} > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    # Cache dependencies for faster Docker builds
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    # Build test Docker image with cache
    - name: Build test Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager
        file: ./task-manager/Dockerfile
        push: false
        load: true
        tags: task-manager:test
        build-args: |
          SKIP_PLAYWRIGHT_INSTALL=true
        cache-from: |
          type=local,src=/tmp/.buildx-cache
        cache-to: |
          type=local,dest=/tmp/.buildx-cache-new

    # Move cache
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    # Install Playwright only if image doesn't exist
    - name: Install Playwright in Docker
      if: steps.check-image.outputs.exists == 'false'
      run: |
        docker run --name playwright-setup \
          task-manager:test \
          bash -c "cd /app && pip install playwright pytest-xdist && playwright install --with-deps chromium firefox webkit"

        docker commit playwright-setup ${{ env.PLAYWRIGHT_IMAGE }}
        docker push ${{ env.PLAYWRIGHT_IMAGE }}
        docker rm playwright-setup

    # Pull existing image if it exists
    - name: Pull Playwright image if exists
      if: steps.check-image.outputs.exists == 'true'
      run: |
        docker pull ${{ env.PLAYWRIGHT_IMAGE }}

    # Build playground in parallel with Playwright install/pull
    - name: Build playground Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager/tests/playground
        file: ./task-manager/tests/playground/Dockerfile
        push: false
        load: true
        tags: playground:test
        cache-from: |
          type=local,src=/tmp/.buildx-cache
        cache-to: |
          type=local,dest=/tmp/.buildx-cache-new,mode=max

    # Create network and start playground
    - name: Setup test environment
      run: |
        docker network create test-network
        
        # Run playground in background
        docker run -d \
          --name playground \
          --network test-network \
          -p 3000:3000 \
          playground:test
        
        # Wait for playground to be ready
        timeout=20
        counter=0
        until curl -s http://localhost:3000 > /dev/null; do
          echo "Waiting for playground to be ready... ($counter seconds elapsed)"
          sleep 2
          counter=$((counter + 2))
          if [ $counter -ge $timeout ]; then
            echo "Error: Playground failed to start within $timeout seconds"
            exit 1
          fi
        done
        echo "Playground is ready!"

    # Run tests in parallel with matrix
    - name: Run tests (group ${{ matrix.test-group }})
      run: |
        # Determine which tests to run based on matrix group
        if [ "${{ matrix.test-group }}" == "1" ]; then
          TEST_PATTERN="tests/test_auth_session.py::test_group_1"
        elif [ "${{ matrix.test-group }}" == "2" ]; then
          TEST_PATTERN="tests/test_auth_session.py::test_group_2"
        else
          TEST_PATTERN="tests/test_auth_session.py::test_group_3"
        fi
        
        # Run the tests
        docker run \
          --network test-network \
          -e AZURE_OPENAI_KEY \
          -e AZURE_OPENAI_ENDPOINT \
          -e PLAYGROUND_URL=http://playground:3000 \
          -e TEST_MODE \
          -e FARMZZ_PASSWORD \
          -e FARMZZ_USERNAME \
          -e TECLA_ACADEMY_PASSWORD \
          -e TECLA_ACADEMY_USERNAME \
          -e S3_BUCKET_NAME \
          -e AWS_ENDPOINT_URL \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -v ${{ github.workspace }}/task-manager:/app \
          ${{ env.PLAYWRIGHT_IMAGE }} \
          bash -c "cd /app && python -m pytest -vvs -n auto --dist=loadfile $TEST_PATTERN"

    # Always clean up resources
    - name: Cleanup
      if: always()
      run: |
        docker rm -f playground || true
        docker network rm test-network || true
