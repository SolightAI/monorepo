name: Task Manager Playground Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'task-manager/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-manager

    env:
      DOCKER_REGISTRY: docker.io
      DOCKER_USERNAME_CI: ${{ secrets.DOCKER_USERNAME_CI }}
      DOCKER_PASSWORD_CI: ${{ secrets.DOCKER_PASSWORD_CI }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      run: |
        echo "Attempting to login to Docker Hub"
        echo ${{ secrets.DOCKER_PASSWORD_CI }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME_CI }} --password-stdin || {
          echo "Failed to login to Docker Hub"
          exit 1
        }

    - name: Build test Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager
        file: ./task-manager/Dockerfile
        push: false
        load: true
        tags: task-manager:test
        build-args: |
          SKIP_PLAYWRIGHT_INSTALL=true
        cache-from: type=registry,ref=laneoai/task-manager:cache
        cache-to: type=registry,ref=laneoai/task-manager:cache,mode=max

    - name: Get image hash and set Playwright image tag
      id: image-hash
      run: |
        IMAGE_HASH=$(docker inspect task-manager:test --format='{{.Id}}' | cut -d':' -f2 | cut -c1-12)
        echo "PLAYWRIGHT_IMAGE=laneoai/task-manager:with-playwright-$IMAGE_HASH" >> $GITHUB_ENV

    - name: Check if Playwright image exists
      id: check-image
      run: |
        if docker manifest inspect ${{ env.PLAYWRIGHT_IMAGE }} > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Install Playwright in Docker
      if: steps.check-image.outputs.exists == 'false'
      run: |
        docker run --name playwright-setup \
          task-manager:test \
          bash -c "cd /app && pip install playwright pytest-xdist && playwright install --with-deps"

        docker commit playwright-setup ${{ env.PLAYWRIGHT_IMAGE }}
        docker push ${{ env.PLAYWRIGHT_IMAGE }}
        docker rm playwright-setup

    - name: Build playground Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager/tests/playground
        file: ./task-manager/tests/playground/Dockerfile
        push: false
        load: true
        tags: playground:test
        cache-from: type=registry,ref=laneoai/task-manager:playground-cache
        cache-to: type=registry,ref=laneoai/task-manager:playground-cache,mode=max

  run-tests:
    needs: build-images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-group: [1, 2, 3]  # Split tests into 3 groups
      fail-fast: false

    defaults:
      run:
        working-directory: ./task-manager

    env:
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      PLAYGROUND_URL: "http://playground:3000"
      PYTHONPATH: ${{ github.workspace }}/task-manager
      TEST_MODE: "false"
      FARMZZ_PASSWORD: ${{ secrets.FARMZZ_PASSWORD }}
      FARMZZ_USERNAME: ${{ secrets.FARMZZ_USERNAME }}
      TECLA_ACADEMY_PASSWORD: ${{ secrets.TECLA_ACADEMY_PASSWORD }}
      TECLA_ACADEMY_USERNAME: ${{ secrets.TECLA_ACADEMY_USERNAME }}
      S3_BUCKET_NAME: task-manager-github-actions
      AWS_ENDPOINT_URL: https://minio-n0ooc44wsgk0kkkwoksw48ck.34.155.147.62.sslip.io
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PLAYWRIGHT_IMAGE: ${{ needs.build-images.outputs.playwright-image }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      run: |
        echo ${{ secrets.DOCKER_PASSWORD_CI }} | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME_CI }} --password-stdin

    - name: Pull Playwright image
      run: docker pull ${{ env.PLAYWRIGHT_IMAGE }}

    - name: Create Docker network
      run: docker network create test-network

    - name: Run playground container
      run: |
        docker run -d \
          --name playground \
          --network test-network \
          -p 3000:3000 \
          playground:test

    - name: Wait for playground to be ready
      run: |
        timeout=20
        counter=0
        until curl -s http://localhost:3000 > /dev/null; do
          echo "Waiting for playground to be ready... ($counter seconds elapsed)"
          sleep 2
          counter=$((counter + 2))
          if [ $counter -ge $timeout ]; then
            echo "Error: Playground failed to start within $timeout seconds"
            exit 1
          fi
        done
        echo "Playground is ready!"

    - name: Run auth session tests
      run: |
        docker run \
          --network test-network \
          -e AZURE_OPENAI_KEY \
          -e AZURE_OPENAI_ENDPOINT \
          -e PLAYGROUND_URL \
          -e TEST_MODE \
          -e FARMZZ_PASSWORD \
          -e FARMZZ_USERNAME \
          -e TECLA_ACADEMY_PASSWORD \
          -e TECLA_ACADEMY_USERNAME \
          -e S3_BUCKET_NAME \
          -e AWS_ENDPOINT_URL \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -v ${{ github.workspace }}/task-manager:/app \
          ${{ env.PLAYWRIGHT_IMAGE }} \
          bash -c "cd /app && python -m pytest -vvs -n auto --dist=loadfile tests/test_auth_session.py::test_group_${{ matrix.test-group }}"

    - name: Cleanup
      if: always()
      run: |
        docker rm -f playground || true
        docker network rm test-network || true
