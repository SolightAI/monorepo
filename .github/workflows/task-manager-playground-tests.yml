name: Task Manager Playground Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'task-manager/**'
  pull_request:
    branches: [ main ]
    # paths:
    #   - 'task-manager/**'
  # Manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  auth-session-tests:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ./task-manager

    env:
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      PLAYGROUND_URL: "http://playground:3000" # use container endpoint
      PYTHONPATH: ${{ github.workspace }}/task-manager
      TEST_MODE: "false"  # we want to upload the results to S3
      FARMZZ_PASSWORD: ${{ secrets.FARMZZ_PASSWORD }}
      FARMZZ_USERNAME: ${{ secrets.FARMZZ_USERNAME }}
      TECLA_ACADEMY_PASSWORD: ${{ secrets.TECLA_ACADEMY_PASSWORD }}
      TECLA_ACADEMY_USERNAME: ${{ secrets.TECLA_ACADEMY_USERNAME }}
      S3_BUCKET_NAME: task-manager-github-actions
      AWS_ENDPOINT_URL: https://minio-n0ooc44wsgk0kkkwoksw48ck.34.155.147.62.sslip.io
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Create unique identifiers for this run
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NETWORK_NAME: test-network-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_IMAGE: task-manager-test-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_IMAGE: task-manager-playwright-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYGROUND_IMAGE: playground-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Playwright Browsers
      uses: actions/cache@v3
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('task-manager/Dockerfile') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Build test Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager
        file: ./task-manager/Dockerfile
        push: false
        load: true
        tags: ${{ env.TEST_IMAGE }}
        build-args: |
          SKIP_PLAYWRIGHT_INSTALL=true

    - name: Build playground Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./task-manager/tests/playground
        file: ./task-manager/tests/playground/Dockerfile
        push: false
        load: true
        tags: ${{ env.PLAYGROUND_IMAGE }}

    - name: Install Playwright in Docker
      run: |
        # Create directories for cache with correct permissions
        mkdir -p ~/.cache/ms-playwright
        
        # Debug: Show cache directory before
        echo "Cache directory contents before install:"
        ls -la ~/.cache/ms-playwright || echo "Directory is empty"
        
        # Check if Playwright browsers are already installed
        if [ -d ~/.cache/ms-playwright/firefox* ] || [ -d ~/.cache/ms-playwright/webkit* ] || [ -d ~/.cache/ms-playwright/chromium* ]; then
          echo "Playwright browsers already installed, skipping installation"
          # Just create the container with the existing cache
          docker run --name playwright-setup \
            -v ~/.cache/ms-playwright:/root/.cache/ms-playwright \
            ${{ env.TEST_IMAGE }} \
            bash -c "cd /app && pip install playwright && ls -la /root/.cache/ms-playwright"
        else
          echo "Installing Playwright and browsers..."
          # Create a container to install Playwright and save its state
          docker run --name playwright-setup \
            -v ~/.cache/ms-playwright:/root/.cache/ms-playwright \
            ${{ env.TEST_IMAGE }} \
            bash -c "cd /app && pip install playwright && PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright playwright install --with-deps && ls -la /root/.cache/ms-playwright"
        fi
        
        # Debug: Show cache directory after
        echo "Cache directory contents after install:"
        ls -la ~/.cache/ms-playwright
        
        # Commit the container with installed Playwright to a new image
        docker commit playwright-setup ${{ env.PLAYWRIGHT_IMAGE }}
        
        # Remove the temporary container
        docker rm playwright-setup

    - name: Create Docker network
      run: |
        # Create the network with unique name
        echo "Creating network: ${{ env.NETWORK_NAME }}"
        docker network create ${{ env.NETWORK_NAME }}

    - name: Run playground container
      run: |
        # Use unique name based on run ID
        CONTAINER_NAME="playground-${{ env.RUN_ID }}"
        echo "Starting container: $CONTAINER_NAME"
        
        docker run -d \
          --name $CONTAINER_NAME \
          --network ${{ env.NETWORK_NAME }} \
          -p 3001:3000 \
          ${{ env.PLAYGROUND_IMAGE }}
          
        # Update environment variable to point to the new container name
        echo "PLAYGROUND_URL=http://$CONTAINER_NAME:3000" >> $GITHUB_ENV

    - name: Wait for playground to be ready
      run: |
        timeout=20
        counter=0
        until curl -s http://localhost:3001 > /dev/null; do
          echo "Waiting for playground to be ready... ($counter seconds elapsed)"
          sleep 2
          counter=$((counter + 2))
          if [ $counter -ge $timeout ]; then
            echo "Error: Playground failed to start within $timeout seconds"
            exit 1
          fi
        done
        echo "Playground is ready!"

    - name: Run auth session tests
      run: |
        docker run \
          --network ${{ env.NETWORK_NAME }} \
          -e AZURE_OPENAI_KEY \
          -e AZURE_OPENAI_ENDPOINT \
          -e PLAYGROUND_URL \
          -e TEST_MODE \
          -e FARMZZ_PASSWORD \
          -e FARMZZ_USERNAME \
          -e TECLA_ACADEMY_PASSWORD \
          -e TECLA_ACADEMY_USERNAME \
          -e S3_BUCKET_NAME \
          -e AWS_ENDPOINT_URL \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -v ${{ github.workspace }}/task-manager:/app \
          -v ~/.cache/ms-playwright:/root/.cache/ms-playwright \
          --user $(id -u):$(id -g) \
          -e PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright \
          ${{ env.PLAYWRIGHT_IMAGE }} \
          bash -c "cd /app && python -m pytest -vvs"

    - name: Cleanup
      if: always()
      run: |
        # Use variables for container and network names
        CONTAINER_NAME="playground-${{ env.RUN_ID }}"
        echo "Cleaning up container: $CONTAINER_NAME"
        docker rm -f $CONTAINER_NAME || true
        
        echo "Cleaning up network: ${{ env.NETWORK_NAME }}"
        docker network rm ${{ env.NETWORK_NAME }} || true
        
        # Clean up Docker images
        echo "Cleaning up Docker images"
        docker rmi ${{ env.TEST_IMAGE }} ${{ env.PLAYWRIGHT_IMAGE }} ${{ env.PLAYGROUND_IMAGE }} || true
      