name: Lambdas Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'agent_jobs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'agent_jobs/**'
  # Manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-url-lambda-tests:
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ./agent_jobs

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}


    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker

    - name: Run Lambda tests
      run: |
        ./run-test.sh
      env:
        IMAGE_NAME: validate-url-test:${{ github.event.pull_request.number || 'main' }}


