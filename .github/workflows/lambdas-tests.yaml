name: Lambdas Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'agent_jobs/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/lambdas-tests.yaml'
      - 'agent_jobs/**'
  # Manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda-tests:
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ./agent_jobs

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FARMZZ_PASSWORD: ${{ secrets.FARMZZ_PASSWORD }}
      FARMZZ_USERNAME: ${{ secrets.FARMZZ_USERNAME }}
      TECLA_ACADEMY_PASSWORD: ${{ secrets.TECLA_ACADEMY_PASSWORD }}
      TECLA_ACADEMY_USERNAME: ${{ secrets.TECLA_ACADEMY_USERNAME }}
      SESAME_HR_PASSWORD: ${{ secrets.SESAME_HR_PASSWORD }}
      SESAME_HR_USERNAME: ${{ secrets.SESAME_HR_USERNAME }}
      MEANDWHO_USERNAME: ${{ secrets.MEANDWHO_USERNAME }}
      MEANDWHO_PASSWORD: ${{ secrets.MEANDWHO_PASSWORD }}
      SOLIGHT_USERNAME: ${{ secrets.SOLIGHT_USERNAME }}
      SOLIGHT_PASSWORD: ${{ secrets.SOLIGHT_PASSWORD }}
      SOLIGHT_RECOVERY_PHONE_NUMBER: ${{ secrets.SOLIGHT_RECOVERY_PHONE_NUMBER }}
      TICKPICK_USERNAME: ${{ secrets.TICKPICK_USERNAME }}
      TICKPICK_PASSWORD: ${{ secrets.TICKPICK_PASSWORD }}
      TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker

    - name: Run Lambda tests
      timeout-minutes: 60
      run: |
        ./run-test.sh
      env:
        IMAGE_NAME: lambda-test:${{ github.event.pull_request.number || 'main' }}

    - name: Cleanup tests containers
      if: always()
      run: |
        # The run-test script should have already cleaned up the resources
        # but just in case, let's do it here too
        docker container rm -f agent-job-test-redis-$RUN_ID || true
        docker container rm -f agent-job-test-minio-$RUN_ID || true
        docker container rm -f agent-job-test-playground-$RUN_ID || true
        docker network rm solight_agent_job_test_shared_network-$RUN_ID || true
