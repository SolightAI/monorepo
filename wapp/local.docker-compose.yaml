services:

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: ["npm", "start"]
    ports:
      - "3000:3000"
    networks:
      - default
    volumes:
      - ./app/src:/app/src
    environment:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["fastapi", "dev", "--reload", "src/main.py", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./api/src:/app/src
    ports:
      - "8000:8000"
    networks:
      - default
      - api-tm_shared_network
    environment:
      - APP_URL=${APP_URL:-http://localhost:3000}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-defaultsecret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-defaultsecret}
      - TASK_MANAGER_URL=${TASK_MANAGER_URL:-http://task-manager:8001}
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=task-manager
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localhost:9000
      # Redis Cache Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0 # Use DB 1 for API cache (task-manager uses 0)
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SYMMETRIC_ENCRYPTION_KEY=${SYMMETRIC_ENCRYPTION_KEY:-S5ox-_h4p9NISVvQFPsAE5T-8K-SNp67GLQalO75rDI=}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - /tmp/db_data:/var/lib/postgresql/data
    networks:
      - default
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8080:80"
    networks:
      - default
    environment:
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}


networks:
  default:
  api-tm_shared_network: # docker network create api-tm_shared_network
    external: true
