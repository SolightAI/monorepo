[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
log_cli = true
log_cli_level = INFO
filterwarnings =
    # Filter warnings from dependencies we can't modify directly
    ignore::DeprecationWarning:pkg_resources.*:
    ignore::DeprecationWarning:importlib.resources.*:
    ignore::DeprecationWarning:browser_use.*:
    ignore:The function `load` is in beta:UserWarning: