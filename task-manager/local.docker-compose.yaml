services:

  task-manager:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/:/app/src
      - playwright_browsers:/tmp/playwright-browsers
    ports:
      - "9000:9000"
    environment:
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - PRIVATE_KEY_PATH=${PRIVATE_KEY_PATH:-/app/keys/private.pem}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - default
      - api-tm_shared_network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default

volumes:
  redis_data:
  playwright_browsers:

networks:
  default:
  api-tm_shared_network: # api and task manager shared network
    external: true
