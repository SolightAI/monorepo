services:

  task-manager:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src/:/app/src
      - ./tests/:/app/tests
      - playwright_browsers:/tmp/playwright-browsers
    environment:
      - ANONYMIZED_TELEMETRY=false
      - DEV_MODE=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - PRIVATE_KEY_PATH=${PRIVATE_KEY_PATH:-/app/keys/private.pem}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=task-manager
      - AWS_ENDPOINT_URL=http://minio:9000
      - PLAYGROUND_URL=http://playground:3000
      - SYMMETRIC_ENCRYPTION_KEY=${SYMMETRIC_ENCRYPTION_KEY:-S5ox-_h4p9NISVvQFPsAE5T-8K-SNp67GLQalO75rDI=}
    networks:
      - default
      - api-tm_shared_network
    depends_on:
      - redis
      - minio

  playground:
    build:
      context: tests/playground
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    networks:
      - default
      - api-tm_shared_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"  # MinIO API
      - "9090:9090"  # MinIO Console
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9090"
    networks:
      - default
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  playwright_browsers:
  minio_data:

networks:
  default:
  api-tm_shared_network: # api and task manager shared network
    external: true
